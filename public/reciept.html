<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Receipt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .receipt-container {
      background: #ffffff;
      padding: 20px;
      width: 350px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 1px dashed #ccc;
      padding-bottom: 10px;
    }

    .receipt-header h1 {
      font-size: 20px;
      margin: 0;
    }

    .receipt-header p {
      margin: 3px 0;
      font-size: 12px;
      color: #555;
    }

    .receipt-info {
      font-size: 12px;
      margin-bottom: 10px;
    }

    .receipt-info div {
      display: flex;
      justify-content: space-between;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 10px;
    }

    .items-table th,
    .items-table td {
      padding: 6px 0;
    }

    .items-table th {
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    .items-table td:nth-child(2),
    .items-table td:nth-child(3) {
      text-align: right;
    }

    .receipt-totals {
      font-size: 12px;
      margin-top: 15px;
      border-top: 1px solid #ddd;
      padding-top: 10px;
    }

    .receipt-totals div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .receipt-footer {
      text-align: center;
      font-size: 11px;
      margin-top: 15px;
      border-top: 1px dashed #ccc;
      padding-top: 8px;
      color: #555;
    }

    #print-btn {
      margin-top: 15px;
      width: 100%;
      padding: 8px 0;
      border: none;
      border-radius: 4px;
      background: #111827;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    #print-btn:hover {
      opacity: 0.9;
    }

    /* Hide the print button when printing */
    @media print {
      #print-btn {
        display: none;
      }

      body {
        background: #ffffff;
        padding: 0;
      }

      .receipt-container {
        box-shadow: none;
        border-radius: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="receipt-container">
    <div class="receipt-header">
      <h1>My Shop</h1>
      <p>123 Market Street</p>
      <p>Phone: +123 456 789</p>
    </div>

    <div class="receipt-info">
      <div>
        <span>Date:</span>
        <span id="receipt-date"></span>
      </div>
      <div>
        <span>Receipt #:</span>
        <span id="receipt-number"></span>
      </div>
      <div>
        <span>Cashier:</span>
        <span id="cashier-name"></span>
      </div>
    </div>

    <table class="items-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="items-body">
        <!-- JS will inject rows here -->
      </tbody>
    </table>

    <div class="receipt-totals">
      <div>
        <strong>Subtotal:</strong>
        <span id="subtotal"></span>
      </div>
      <div>
        <strong>Tax (16%):</strong>
        <span id="tax"></span>
      </div>
      <div>
        <strong>Grand Total:</strong>
        <span id="grand-total"></span>
      </div>
      <div>
        <strong>Paid:</strong>
        <span id="amount-paid"></span>
      </div>
      <div>
        <strong>Change:</strong>
        <span id="change"></span>
      </div>
    </div>

    <div class="receipt-footer">
      <p>Thank you for shopping with us!</p>
      <p>This system is made by AmanahDevelopers</p>
      <p>contacts: amanahmvp@gmail.com</p>
    </div>

    <button id="print-btn" onclick="window.print()">Print Receipt</button>
  </div>

  <script>
    // Format number as currency (KSH example)
    function formatCurrency(value) {
      return "KSH " + parseFloat(value).toFixed(2);
    }

    function loadReceipt() {
      // Try to get receipt data from localStorage
      const storedReceipt = localStorage.getItem('lastReceipt');

      let data;
      if (storedReceipt) {
        data = JSON.parse(storedReceipt);
        // Ensure date is a Date object
        data.date = new Date(data.date);
      } else {
        // Fallback mock data
        data = {
          number: "RCP-SAMPLE",
          cashier: "Demo User",
          date: new Date(),
          items: [
            { name: "Sample Item", price: 100, quantity: 1 }
          ],
          amountPaid: 100,
          taxRate: 0.16
        };
      }

      // Basic info
      document.getElementById("receipt-number").textContent = data.number;
      document.getElementById("cashier-name").textContent = data.cashier || "Shopkeeper";
      document.getElementById("receipt-date").textContent = new Date(data.date).toLocaleString();

      const itemsBody = document.getElementById("items-body");
      itemsBody.innerHTML = "";

      let subtotal = 0;

      data.items.forEach(item => {
        const row = document.createElement("tr");

        const itemNameCell = document.createElement("td");
        itemNameCell.textContent = item.name;

        const qtyCell = document.createElement("td");
        qtyCell.textContent = item.quantity;

        const totalPrice = item.price * item.quantity;
        subtotal += totalPrice;

        const totalCell = document.createElement("td");
        totalCell.textContent = formatCurrency(totalPrice);

        row.appendChild(itemNameCell);
        row.appendChild(qtyCell);
        row.appendChild(totalCell);

        itemsBody.appendChild(row);
      });

      // If totals are provided in data, use them, otherwise calculate
      const tax = data.tax !== undefined ? data.tax : (subtotal * (data.taxRate || 0.16));
      const grandTotal = data.total !== undefined ? data.total : (subtotal + tax);
      const amountPaid = data.amountPaid !== undefined ? data.amountPaid : grandTotal;
      const change = amountPaid - grandTotal;

      document.getElementById("subtotal").textContent = formatCurrency(subtotal);
      document.getElementById("tax").textContent = formatCurrency(tax);
      document.getElementById("grand-total").textContent = formatCurrency(grandTotal);
      document.getElementById("amount-paid").textContent = formatCurrency(amountPaid);
      document.getElementById("change").textContent = formatCurrency(change);

      // Auto print if requested
      if (new URLSearchParams(window.location.search).has('print')) {
        window.print();
      }
    }

    // Load receipt on page load
    document.addEventListener('DOMContentLoaded', loadReceipt);
  </script>
</body>

</html>
