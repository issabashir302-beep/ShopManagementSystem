<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Create Account</title>
    
    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />
    
    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background animation -->
    <div class="background-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
      <button class="theme-toggle" aria-label="Toggle theme">
        <div class="theme-toggle-inner">
          <div class="sun-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z" fill="currentColor"/>
              <path d="M12 1V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 21V23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.22 4.22L5.64 5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M18.36 18.36L19.78 19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M1 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M21 12H23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.22 19.78L5.64 18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="moon-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M21 12.79C20.8427 14.4922 20.2039 16.1144 19.1582 17.4668C18.1126 18.8192 16.7035 19.8458 15.0957 20.4265C13.4879 21.0073 11.748 21.1181 10.0795 20.7461C8.41102 20.3741 6.88299 19.5345 5.67422 18.3258C4.46545 17.117 3.62594 15.589 3.2539 13.9205C2.88186 12.252 2.99274 10.5121 3.57348 8.9043C4.15422 7.29651 5.18085 5.88737 6.53323 4.84175C7.88561 3.79614 9.50779 3.15731 11.21 3C10.2134 4.34827 9.73385 6.00945 9.85856 7.68141C9.98326 9.35338 10.7039 10.9251 11.8894 12.1106C13.0749 13.2961 14.6466 14.0167 16.3186 14.1414C17.9906 14.2662 19.6517 13.7866 21 12.79Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="theme-toggle-thumb"></div>
        </div>
        <span class="theme-toggle-label">Theme</span>
      </button>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="apple-logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Sign up to get started with premium features</p>
        </div>
        
        <form id="signup-form" class="auth-form">
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="full_name" 
                        placeholder="Enter your full name" 
                        required
                        class="auth-input"
                        autocomplete="name"
                    >
                    <div class="input-focus-line"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="name@example.com" 
                        required
                        class="auth-input"
                        autocomplete="email"
                    >
                    <div class="input-focus-line"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Create a strong password" 
                        required
                        class="auth-input"
                        autocomplete="new-password"
                    >
                    <div class="input-focus-line"></div>
                    <button type="button" class="password-toggle" id="toggleSignupPassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="validation-hint">
                    <i class="fas fa-info-circle"></i>
                    Must be at least 8 characters with letters and numbers
                </div>
            </div>
            
            <div class="form-group">
                <label for="role">Select Role</label>
                <div class="select-group">
                    <select id="role" class="auth-select" required>
                        <option value="">Select your role</option>
                        <option value="admin">Administrator</option>
                        <option value="shopkeeper">Shopkeeper</option>
                    </select>
                    <div class="input-focus-line"></div>
                </div>
            </div>
            
            <button type="submit" class="auth-btn" id="signupButton">
                <span class="btn-text">Create Account</span>
                <div class="btn-loader">
                    <div class="loader-dot"></div>
                    <div class="loader-dot"></div>
                    <div class="loader-dot"></div>
                </div>
            </button>
            
            <p id="signup-error" class="error-message"></p>
        </form>
        
        <div class="auth-link">
            Already have an account?
            <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
        // Password toggle functionality
        document.getElementById('toggleSignupPassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Password validation
        function validatePassword(password) {
            const minLength = 8;
            const hasLetter = /[a-zA-Z]/.test(password);
            const hasNumber = /\d/.test(password);
            
            return password.length >= minLength && hasLetter && hasNumber;
        }

        // Form submission with validation
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('signupButton');
            const errorMsg = document.getElementById('signup-error');
            
            // Get form values
            const fullName = document.getElementById('full_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            // Validate all fields
            if (!fullName || !email || !password || !role) {
                errorMsg.textContent = 'Please fill in all required fields.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMsg.textContent = 'Please enter a valid email address.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Validate password strength
            if (!validatePassword(password)) {
                errorMsg.textContent = 'Password must be at least 8 characters long and contain both letters and numbers.';
                errorMsg.classList.add('show');
                return;
            }
            
            // Show loading state
            submitBtn.classList.add('loading');
            errorMsg.classList.remove('show');
            
            // Simulate API call
            setTimeout(() => {
                console.log('Signup data:', { 
                    fullName, 
                    email, 
                    password: '***', 
                    role 
                });
                
                // Show success message
                alert(`🎉 Account created successfully!\n\nWelcome ${fullName}!\n\nYou will be redirected to your dashboard.`);
                
                // Redirect to dashboard
                window.location.href = 'admin.html';
            }, 2000);
        });

        // Real-time password validation
        document.getElementById('password').addEventListener('input', function() {
            const hint = document.querySelector('.validation-hint');
            
            if (this.value.length === 0) {
                hint.classList.remove('valid');
                return;
            }
            
            if (validatePassword(this.value)) {
                hint.classList.add('valid');
                hint.innerHTML = '<i class="fas fa-check-circle"></i> Password meets requirements';
            } else {
                hint.classList.remove('valid');
                hint.innerHTML = '<i class="fas fa-info-circle"></i> Must be at least 8 characters with letters and numbers';
            }
        });

        // Add validation styling to inputs
        const inputs = document.querySelectorAll('.auth-input, .auth-select');
        inputs.forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value) {
                    if (this.checkValidity()) {
                        this.classList.add('valid');
                        this.classList.remove('invalid');
                    } else {
                        this.classList.add('invalid');
                        this.classList.remove('valid');
                    }
                } else {
                    this.classList.remove('valid', 'invalid');
                }
            });
        });

        // Press Enter to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.querySelector('#signupButton.loading')) {
                document.getElementById('signup-form').dispatchEvent(new Event('submit'));
            }
        });

        // Initialize select with first option selected
        document.getElementById('role').selectedIndex = 0;
    </script>
    
    <!-- Theme Script -->
    <script src="js/theme.js"></script>
</body>
</html>
