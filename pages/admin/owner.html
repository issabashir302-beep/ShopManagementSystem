<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Shopwise owner workspace" />
    <title>Shopwise — Owner</title>
    <link rel="stylesheet" href="../../assets/css/variables.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/app.css" />
    <link rel="stylesheet" href="../../assets/css/refinements.css" />
    <link rel="stylesheet" href="../../assets/css/responsive.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <div class="scrim" data-close-nav></div>
      <aside class="sidebar" aria-label="Owner navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <div class="brand-name">Shopwise</div>
            <div class="brand-sub">MiniPOS</div>
          </div>
          <button
            class="sidebar-close"
            data-close-nav
            aria-label="Close navigation"
          >
            ×
          </button>
        </div>
        <nav class="nav" id="ownerNav"></nav>
        <div class="sidebar-user">
          <div class="user-row">
            <div class="avatar">AM</div>
            <div class="user-meta">
              <strong>Amina Mwangi</strong><span>Owner</span>
            </div>
            <a
              class="btn btn-ghost btn-icon"
              href="../auth/login.html"
              aria-label="Sign out"
              ><svg class="icon"><use href="#i-logout" /></svg
            ></a>
          </div>
        </div>
      </aside>
      <header class="topbar">
        <div class="topbar-actions">
          <button
            class="btn btn-ghost btn-icon mobile-menu"
            data-open-nav
            aria-label="Open navigation"
          >
            <svg class="icon"><use href="#i-menu" /></svg></button
          ><span class="topbar-title" id="topbarTitle">Overview</span>
        </div>
        <div class="topbar-actions">
          <span class="muted" id="todayLabel"></span
          ><button class="btn btn-ghost btn-icon" aria-label="Notifications">
            <svg class="icon"><use href="#i-bell" /></svg>
          </button>
          <div class="avatar">AM</div>
        </div>
      </header>
      <main class="main" id="pageContent" tabindex="-1"></main>
    </div>
    <div class="modal-backdrop" id="modalRoot" aria-hidden="true"></div>
    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <div id="receiptPrint"></div>
    <svg class="sr-only" aria-hidden="true">
      <defs>
        <symbol id="i-menu" viewBox="0 0 24 24">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="4" y="4" width="6" height="6" />
          <rect x="14" y="4" width="6" height="6" />
          <rect x="4" y="14" width="6" height="6" />
          <rect x="14" y="14" width="6" height="6" />

    </svg>
    <script src="../../assets/js/api/config.js"></script>
    <script src="../../assets/js/api/apiClient.js"></script>
    <script src="../../assets/js/auth/session.js"></script>

    <script src="../../assets/js/ui/ui.js"></script>
    <script src="../../assets/js/pages/owner.js"></script>

</html>
