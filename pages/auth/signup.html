<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopwise | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../admin/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            /* Slightly wider for signup */
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-md);
            color: white;
            font-size: 1.5rem;
            box-shadow: var(--shadow-md);
        }

        .auth-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .auth-footer {
            margin-top: var(--spacing-lg);
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            margin-top: var(--spacing-sm);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-user-plus"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join Shopwise to manage your business</p>
        </div>

        <form id="signupForm">
            <div class="form-group" style="margin-bottom: var(--spacing-md);">
                <label class="form-label">Full Name</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="far fa-user"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="text" class="form-input" style="padding-left: 40px; width: 100%;"
                        placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: var(--spacing-md);">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="far fa-envelope"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="email" class="form-input" style="padding-left: 40px; width: 100%;"
                        placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: var(--spacing-md);">
                <label class="form-label">Password</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="fas fa-lock"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="password" class="form-input" style="padding-left: 40px; width: 100%;"
                        placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: var(--spacing-md);">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper" style="position: relative;">
                    <i class="fas fa-lock"
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="password" class="form-input" style="padding-left: 40px; width: 100%;"
                        placeholder="••••••••" required>
                </div>
            </div>



            <button type="submit" class="submit-btn" style="margin-top: 24px;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html" class="auth-link">Sign in</a>
        </div>
    </div>
</body>

</html>
